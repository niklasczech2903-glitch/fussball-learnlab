<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="LearnLab"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>LearnLab · Fußballanalyse</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,Inter,Arial,sans-serif;color:#f7f6ff;background:#0d0f1a}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(85px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 90% 0,#242048 0,transparent 35%),#0d0f1a;min-height:100vh}main{max-width:760px;margin:auto;padding:22px 18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:24px;font-weight:850;letter-spacing:-1px}.brand span{color:#a995ff}.sub{color:#a6a7bc;font-size:13px}.pill{border:1px solid #3a375a;border-radius:30px;padding:8px 12px;color:#d5cfff;font-size:12px}h1{font-size:29px;letter-spacing:-1px;margin:0 0 7px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.hero,.panel,.module{border:1px solid #34324b;background:#191b2c;border-radius:20px;padding:19px;margin:14px 0}.hero{background:linear-gradient(130deg,#302657,#171a2d)}.muted{color:#a7a8bd;font-size:14px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#26283d;padding:15px;border-radius:14px}.metric strong{font-size:23px;display:block;margin-top:5px}.progress{height:9px;background:#33334d;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,#806cff,#40e1ba);width:0}.module{display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}.module .emoji{font-size:28px;background:#2b2a46;padding:13px;border-radius:15px}.module .body{flex:1}.module h3{margin:0 0 4px}.module small{color:#aaaac1;line-height:1.4}.arrow{color:#9c91f5;font-size:22px}button{cursor:pointer}button.primary,.secondary{border:0;border-radius:13px;padding:13px 17px;color:white;background:#7865ef;font-size:15px;font-weight:700}.secondary{background:#30324b}.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.lesson{border:1px solid #383951;border-radius:15px;padding:15px;margin:12px 0;background:#202237}.lesson p{line-height:1.6;color:#d1d0df;font-size:14px}.check{display:flex;gap:10px;align-items:center;margin:13px 0;color:#d4d3e5;font-size:14px}.check input{width:21px;height:21px;accent-color:#8c79ff}input,select{background:#282a40;color:white;border:1px solid #494861;padding:12px;border-radius:12px;max-width:100%;font-size:16px}.quizopt{display:block;width:100%;text-align:left;background:#272940;color:white;border:1px solid #494861;padding:15px;margin:9px 0;border-radius:12px;font-size:15px}.quizopt.selected{border-color:#aa97ff;background:#3a305c}.good{color:#57dfb6}.bad{color:#ff9a9a}.nav{position:fixed;bottom:0;left:0;right:0;background:#171827f5;border-top:1px solid #333348;display:flex;justify-content:space-around;padding:12px 5px calc(10px + env(safe-area-inset-bottom));z-index:3}.nav button{background:none;border:0;color:#a8a6bc;font-size:12px;min-width:65px}.nav button.active{color:#b6a7ff}.nav .symbol{display:block;font-size:23px;margin-bottom:3px}.hidden{display:none}.spaced{margin:18px 0}textarea{width:100%;min-height:100px;background:#26283e;color:white;border:1px solid #4b4966;border-radius:12px;padding:12px;font:inherit}a{color:#b4a5ff} .badge{font-size:11px;color:#66e4c1}
</style><style>
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #514b77;background:#24243e;color:#ddd7ff;border-radius:30px;padding:9px 12px;font-size:13px}.chip.active{background:#6652cb;border-color:#9c89ff;color:#fff}.scenario{border:1px solid #47405f;border-radius:18px;padding:16px;background:#202039;margin:12px 0}.scenario h3{font-size:18px}.scenario .grid{margin:10px 0}.scenario input{width:100%}.tip{padding:12px;border-radius:12px;background:#30284c;color:#e4ddff;font-size:13px;line-height:1.55}.scorecard{border:1px solid #3d3a5d;border-radius:14px;padding:12px;margin:9px 0}.smallbtn{border:1px solid #595276;background:#292843;color:#fff;border-radius:10px;padding:10px;font-size:13px}.bartrack{height:7px;background:#35334d;border-radius:8px;overflow:hidden;margin:8px 0}.bartrack div{height:100%;background:#58d8ba}.warn{color:#ffb9a3}.secondary:disabled,.primary:disabled{opacity:.45}.nav{overflow-x:auto;gap:3px}.nav button{min-width:53px;flex:1}.nav .symbol{font-size:20px}.tag{font-size:11px;color:#b5a9ff}.statrow{display:flex;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid #34334d}
</style></head><body><main><header><div class="brand">⚽ Learn<span>Lab</span></div><div class="pill">● Offline bereit</div></header><div id="app"></div></main><nav class="nav"><button data-tab="home"><span class="symbol">⌂</span>Start</button><button data-tab="modules"><span class="symbol">▦</span>Lernen</button><button data-tab="quiz"><span class="symbol">◉</span>Quiz</button><button data-tab="tools"><span class="symbol">▤</span>Tools</button><button data-tab="profile"><span class="symbol">◷</span>Profil</button></nav><script src="content.js"></script><script>
const KEY='learnlab_football_v1';let state={done:{},notes:{},quizHistory:[],tab:'home'};try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');state={...state,...saved,tab:'home'}}catch{};let currentModule=0,quizIndex=0,answers=[],selected=null;const app=document.getElementById('app');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Speichern fehlgeschlagen. Bitte Backup exportieren.')}};const total=MODULES.reduce((s,m)=>s+m[3].length,0);const completed=()=>Object.values(state.done).filter(Boolean).length;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=()=>Math.round(completed()/total*100);const title=(h,s='')=>`<h1>${h}</h1><p class="muted">${s}</p>`;function show(tab){state.tab=tab;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();window.scrollTo(0,0)}function render(){if(state.tab==='home'){app.innerHTML=title('Dein Lern-Cockpit','Lerne Fußballanalyse in deinem Tempo – ohne Wochenplan.')+`<section class="hero"><div class="sub">DEIN LERNFORTSCHRITT</div><h1>${pct()} %</h1><div class="progress"><div class="fill" style="width:${pct()}%"></div></div><div class="muted">${completed()} von ${total} Lektionen abgeschlossen</div><br><button class="primary" onclick="show('modules')">Weiterlernen →</button></section><div class="grid"><div class="metric"><span class="sub">Kategorien</span><strong>${MODULES.length}</strong></div><div class="metric"><span class="sub">Quizversuche</span><strong>${state.quizHistory.length}</strong></div></div><section class="panel"><h2>Dein Lernsystem</h2><p class="muted">Wähle eine Kategorie, lies die Erklärungen, löse Praxisaufgaben und markiere Lektionen als abgeschlossen. Mit Quiz, Quotenrechner und Notizen.</p><button class="secondary wide" onclick="show('quiz')">Wissen testen</button></section>`}else if(state.tab==='modules'){app.innerHTML=title('Lernkategorien','Sechs Themenbereiche · 18 Lektionen · frei wählbar')+MODULES.map((m,i)=>{const done=m[3].filter((_,j)=>state.done[i+'-'+j]).length;return `<button class="module" onclick="openModule(${i})"><div class="emoji">${['📐','⚽','📈','📊','🛡️','🧠'][i]}</div><div class="body"><h3>${esc(m[0])}</h3><small>${esc(m[2])}</small><div class="sub">${done}/${m[3].length} abgeschlossen</div></div><span class="arrow">›</span></button>`}).join('')}else if(state.tab==='lesson'){const m=MODULES[currentModule];app.innerHTML=`<button class="secondary" onclick="show('modules')">← Kategorien</button><div class="spaced">${title(esc(m[0]),esc(m[2]))}</div>`+m[3].map((l,j)=>`<article class="lesson"><div class="row"><h3>${j+1}. ${esc(l[0])}</h3>${state.done[currentModule+'-'+j]?'<span class="badge">✓ Fertig</span>':''}</div><p>${esc(l[1])}</p><div class="sub"><strong>Deine Übung:</strong> ${esc(l[2])}</div><label class="check"><input type="checkbox" ${state.done[currentModule+'-'+j]?'checked':''} onchange="toggleLesson(${currentModule},${j},this.checked)"> Lektion abgeschlossen</label><label class="sub" for="note${j}">Meine Notizen</label><textarea id="note${j}" placeholder="Erkenntnisse, Rechnungen, Beispiele …" oninput="note(${currentModule},${j},this.value)">${esc(state.notes[currentModule+'-'+j]||'')}</textarea></article>`).join('')}else if(state.tab==='quiz'){renderQuiz()}else if(state.tab==='tools'){app.innerHTML=title('Analyse-Tools','Mathematik zum Nachrechnen und Verstehen.')+`<section class="panel"><h2>Quoten- & EV-Rechner</h2><label class="sub">Dezimalquote</label><p><input id="odd" type="number" min="1.01" step="0.01" value="1.80" oninput="calc()"></p><label class="sub">Eigene Wahrscheinlichkeit (%)</label><p><input id="prob" type="number" min="0" max="100" step="0.1" value="60" oninput="calc()"></p><div id="result"></div><p class="muted">Der Erwartungswert ist nur aussagekräftig, wenn die eigene Schätzung belastbar ist. Kein Wettsignal.</p></section><section class="panel"><h2>Poisson: Über 2,5 Tore</h2><label class="sub">Erwartete Gesamttore (λ)</label><p><input id="lambda" type="number" min="0" max="10" step="0.1" value="2.8" oninput="calc()"></p><div id="poisson"></div><p class="muted">Vereinfachtes Lernmodell mit Poisson-verteilten Gesamttoren.</p></section>`;calc()}else if(state.tab==='profile'){app.innerHTML=title('Dein Lernprofil','Fortschritt, Sicherung und Wiederherstellung.')+`<section class="panel"><h2>${completed()} / ${total} Lektionen</h2><div class="progress"><div class="fill" style="width:${pct()}%"></div></div><p class="muted">Dein Fortschritt und deine Notizen werden lokal auf diesem Gerät gespeichert.</p><button class="primary wide" onclick="backup()">JSON-Backup exportieren</button><p><label class="sub">Backup importieren</label><input type="file" accept="application/json,.json" onchange="restore(this)"></p><p class="muted">Import ersetzt den aktuellen Lernfortschritt. Sichere ihn vorher.</p></section><section class="panel"><h2>Datenschutz & Grenzen</h2><p class="muted">Keine Anmeldung, keine Analyse-Datenbank, keine Wettabgabe. Lokale Daten können beim Löschen der App verloren gehen. Die Inhalte dienen dem Lernen, nicht der Vorhersage sicherer Gewinne.</p><button class="secondary wide" onclick="resetProgress()">Lernfortschritt zurücksetzen</button></section>`}}
function openModule(i){currentModule=i;show('lesson')}function toggleLesson(i,j,v){state.done[i+'-'+j]=v;save();render()}function note(i,j,v){state.notes[i+'-'+j]=v;save()}function calc(){const q=Number(document.getElementById('odd')?.value),p=Number(document.getElementById('prob')?.value)/100,lambda=Number(document.getElementById('lambda')?.value);document.getElementById('result').innerHTML=q>1&&p>=0&&p<=1?`<div class="grid"><div class="metric"><span class="sub">Implizit</span><strong>${(100/q).toFixed(1)} %</strong></div><div class="metric"><span class="sub">Modell-EV</span><strong>${((p*q-1)*100).toFixed(1)} %</strong></div></div>`:'<p class="bad">Ungültige Eingabe</p>';document.getElementById('poisson').innerHTML=lambda>=0&&lambda<=10?`<div class="metric"><span class="sub">P(Über 2,5)</span><strong>${((1-Math.exp(-lambda)*(1+lambda+lambda*lambda/2))*100).toFixed(1)} %</strong></div>`:'<p class="bad">Bitte λ zwischen 0 und 10 eingeben</p>'}function renderQuiz(){const q=QUESTIONS[quizIndex];if(quizIndex>=QUESTIONS.length){const score=answers.filter((a,i)=>a===QUESTIONS[i][2]).length;app.innerHTML=title('Quiz abgeschlossen',`${score} von ${QUESTIONS.length} Fragen richtig`)+`<section class="panel"><h2>${Math.round(score/QUESTIONS.length*100)} %</h2><p class="muted">Nutze Fehler als Lernhinweise und wiederhole passende Lektionen.</p><button class="primary wide" onclick="restartQuiz()">Erneut starten</button></section>`;if(!state.quizHistory.length||state.quizHistory.at(-1).id!==quizSession){state.quizHistory.push({id:quizSession,score,total:QUESTIONS.length,date:new Date().toISOString()});save()}return}app.innerHTML=title('Wissensquiz',`Frage ${quizIndex+1} von ${QUESTIONS.length}`)+`<div class="progress"><div class="fill" style="width:${quizIndex/QUESTIONS.length*100}%"></div></div><section class="panel"><h2>${esc(q[0])}</h2>${q[1].map((a,i)=>`<button class="quizopt ${selected===i?'selected':''}" onclick="selectAnswer(${i})">${esc(a)}</button>`).join('')}<div id="feedback"></div><button class="primary wide" id="next" onclick="nextQuestion()" ${selected===null?'disabled':''}>${selected===null?'Antwort auswählen':'Antwort prüfen / Weiter'}</button></section>`}let quizSession=Date.now(),revealed=false;function selectAnswer(i){if(revealed)return;selected=i;renderQuiz()}function nextQuestion(){if(selected===null)return;const q=QUESTIONS[quizIndex];if(!revealed){revealed=true;document.getElementById('feedback').innerHTML=`<p class="${selected===q[2]?'good':'bad'}">${selected===q[2]?'Richtig!':'Nicht ganz.'} ${esc(q[3])}</p>`;document.getElementById('next').textContent='Nächste Frage →';return}answers.push(selected);quizIndex++;selected=null;revealed=false;renderQuiz()}function restartQuiz(){quizIndex=0;answers=[];selected=null;revealed=false;quizSession=Date.now();renderQuiz()}function backup(){const data=JSON.stringify({version:1,done:state.done,notes:state.notes,quizHistory:state.quizHistory},null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='learnlab-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(input){const f=input.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||typeof d.done!=='object'||Array.isArray(d.done)||typeof d.notes!=='object'||Array.isArray(d.notes)||!Array.isArray(d.quizHistory))throw Error('Format');if(!confirm('Vorhandenen Lernfortschritt durch das Backup ersetzen?'))return;state.done=d.done;state.notes=d.notes;state.quizHistory=d.quizHistory;save();render();alert('Backup importiert')}catch{alert('Ungültige Backup-Datei')}}function resetProgress(){if(confirm('Alle Lektionen, Notizen und Quizresultate löschen?')){state.done={};state.notes={};state.quizHistory=[];save();render()}}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));show('home');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script src="upgrade.js"></script></body></html>
